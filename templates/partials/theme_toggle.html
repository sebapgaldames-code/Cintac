<label class="theme-toggle theme-toggle-icon{% if panel %} panel-theme-toggle{% endif %}" for="theme-switch">
	<span class="theme-toggle-label">Modo oscuro</span>
	<input class="theme-switch-input" id="theme-switch" type="checkbox" role="switch" aria-label="Activar modo oscuro">
	<span class="theme-switch-track" aria-hidden="true">
		<span>
			<svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.2 15.4A8.3 8.3 0 0 1 8.6 3.8 8.4 8.4 0 1 0 20.2 15.4Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
			<svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
		</span>
	</span>
</label>
